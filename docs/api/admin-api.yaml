      type: object
      required: [type, content]
      properties:
        type: { type: string, enum: [keyword, regex, category] }
        content: { type: string }
        riskLevel: { type: string, enum: [low, medium, high] }
        enabled: { type: boolean }

    AuditRuleVO:
      allOf:
        - $ref: '#/components/schemas/AuditRuleDTO'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            createTime: { type: string, format: date-time }

