components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 10 }

  schemas:

    Result:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: object }

    ResultVoid:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: object, nullable: true }

    ResultLong:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: integer, format: int64 }

    Page:
      type: object
      properties:
        total: { type: integer, format: int64 }
        records: { type: array, items: { type: object } }

    PageUserVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/UserVO' }

    PageCertificationVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/CertificationVO' }

    PageProductVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ProductVO' }

    PageOrderVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/OrderVO' }

    PageReviewVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ReviewVO' }

    PageAnnouncementVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AnnouncementVO' }

    PageReportVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ReportVO' }

    PageAppealVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AppealVO' }

    PageAuditRecordVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AuditRecordVO' }

    PageAuditRuleVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AuditRuleVO' }

    PageChatSessionVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ChatSessionVO' }

    PageKnowledgeVO:
      allOf:
