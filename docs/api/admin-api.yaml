                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AdminVO' }

    PageLoginLogVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/LoginLogVO' }

    PageOperationLogVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/OperationLogVO' }

    LoginDTO:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginVO:
      type: object
      properties:
        token: { type: string }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }

    UserVO:
      type: object
