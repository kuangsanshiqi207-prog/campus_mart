        userId: { type: integer, format: int64 }
        username: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: integer, format: int64 }
        createTime: { type: string, format: date-time }

    ConfigVO:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string }