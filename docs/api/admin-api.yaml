        buyerNickname: { type: string }
        sellerId: { type: integer, format: int64 }
        sellerNickname: { type: string }
        amount: { type: number }
        status: { type: string }
        createTime: { type: string, format: date-time }

    ReviewVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        fromUserId: { type: integer, format: int64 }
        toUserId: { type: integer, format: int64 }
        score: { type: integer }
        content: { type: string }
        createTime: { type: string, format: date-time }

    AnnouncementDTO:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        status: { type: string, enum: [draft, published] }

    AnnouncementVO:
      allOf:
        - $ref: '#/components/schemas/AnnouncementDTO'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            createTime: { type: string, format: date-time }

    ReportVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reporterId: { type: integer, format: int64 }
        targetType: { type: string }
        targetId: { type: integer, format: int64 }
        reason: { type: string }
        description: { type: string }
        images:
          type: array
          items: { type: string }
        status: { type: string }
        action: { type: string }
        createTime: { type: string, format: date-time }

    AppealVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reportId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createTime: { type: string, format: date-time }

    AuditRecordVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        requestId: { type: string }
        riskLevel: { type: string, enum: [low, medium, high] }
        action: { type: string, enum: [pass, manual_review, reject] }
        labels:
          type: array
          items: { type: string }
        reason: { type: string }
        confidence: { type: number }
        model: { type: string }
        reviewedBy: { type: integer, format: int64 }
        reviewedAt: { type: string, format: date-time }
        createTime: { type: string, format: date-time }

