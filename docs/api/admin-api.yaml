      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string, enum: [ai, human, closed] }
        lastMessage: { type: string }
        lastMessageTime: { type: string, format: date-time }
        createTime: { type: string, format: date-time }

    ChatMessageVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        role: { type: string, enum: [user, ai, human] }
        content: { type: string }
        createTime: { type: string, format: date-time }

    KnowledgeDTO:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        enabled: { type: boolean }

    KnowledgeVO:
      allOf:
        - $ref: '#/components/schemas/KnowledgeDTO'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            createTime: { type: string, format: date-time }

    OverviewVO:
      type: object
      properties:
        userTotal: { type: integer, format: int64 }
        userToday: { type: integer, format: int64 }
        productTotal: { type: integer, format: int64 }
        productToday: { type: integer, format: int64 }
        orderTotal: { type: integer, format: int64 }
        orderToday: { type: integer, format: int64 }
        reportPending: { type: integer, format: int64 }
        auditPending: { type: integer, format: int64 }

    TrendVO:
      type: object
      properties:
        dates:
          type: array
          items: { type: string, format: date }
        values:
          type: array
          items: { type: integer, format: int64 }

    AuditStatsVO:
      type: object
      properties:
        total: { type: integer, format: int64 }
        passCount: { type: integer, format: int64 }
        manualCount: { type: integer, format: int64 }
        rejectCount: { type: integer, format: int64 }
        avgConfidence: { type: number }

    ReportStatsVO:
      type: object
      properties:
        total: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        valid: { type: integer, format: int64 }
        invalid: { type: integer, format: int64 }
        handleRate: { type: number }

    AdminCreateDTO:
      type: object
      required: [username, password, roleId]
