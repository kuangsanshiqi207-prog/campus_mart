                      data: { $ref: '#/components/schemas/TrendVO' }

  # ==================== 12 文件 ====================
  /user/files/upload:
    post:
      tags: [12-用户端-文件]
      summary: 上传图片/文件
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileVO' }

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 10 }

  schemas:

    # ---------- 通用 ----------
    Result:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: object }
    ResultVoid:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: object, nullable: true }
    ResultLong:
      type: object
      properties:
        code: { type: integer, example: 1 }
        msg: { type: string }
        data: { type: integer, format: int64 }
    Page:
      type: object
      properties:
        total: { type: integer, format: int64 }
        records: { type: array, items: { type: object } }

    PageProductVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ProductVO' }
    PageOrderVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/OrderVO' }
    PageReviewVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ReviewVO' }
    PageMessageVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/MessageVO' }
    PageAnnouncementVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/AnnouncementVO' }
    PageConversationVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ConversationVO' }
    PageReportVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/ReportVO' }
    PageCreditLogVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    records:
                      type: array
                      items: { $ref: '#/components/schemas/CreditLogVO' }

    # ---------- 认证 ----------
    SendCodeDTO:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$', example: '13800138000' }
    RegisterDTO:
      type: object
      required: [username, password, phone, code]
      properties:
        username: { type: string, minLength: 4, maxLength: 20 }
        password: { type: string, minLength: 6, maxLength: 32 }
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        code: { type: string }
    LoginDTO:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    ResetPasswordDTO:
      type: object
      required: [phone, code, newPassword]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        code: { type: string }
        newPassword: { type: string, minLength: 6, maxLength: 32 }
    LoginVO:
      type: object
      properties:
        token: { type: string }
        userId: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        role: { type: string }

    # ---------- 用户 ----------
    UserVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        phone: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [normal, banned] }
        certified: { type: integer }
        creditScore: { type: integer }
        createTime: { type: string, format: date-time }
    UserUpdateDTO:
      type: object
      properties:
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        intro: { type: string }
    PasswordUpdateDTO:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string }
        newPassword: { type: string }
    CertificationDTO:
      type: object
      required: [school, studentNo, realName]
      properties:
        school: { type: string }
        studentNo: { type: string }
        realName: { type: string }
        cardImage: { type: string }
    CertificationVO:
      allOf:
        - $ref: '#/components/schemas/CertificationDTO'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            userId: { type: integer, format: int64 }
            status: { type: string, enum: [pending, approved, rejected] }
            reason: { type: string }
            createTime: { type: string, format: date-time }
    AddressDTO:
      type: object
      required: [receiver, phone, detail]
      properties:
        receiver: { type: string }
        phone: { type: string }
        region: { type: string }
        detail: { type: string }
        isDefault: { type: boolean }
    AddressVO:
      allOf:
        - $ref: '#/components/schemas/AddressDTO'
        - type: object
          properties:
            id: { type: integer, format: int64 }
    SellerVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        avatar: { type: string }
        creditScore: { type: integer }
        certified: { type: integer }
        productCount: { type: integer }
        avgScore: { type: number }

    # ---------- 商品 ----------
    ProductCreateDTO:
      type: object
      required: [title, description, price, categoryId, images]
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        condition: { type: string, enum: [new, almost_new, good, normal] }
        categoryId: { type: integer, format: int64 }
        tradeType: { type: string, enum: [face, express, self_pickup] }
        tradePlace: { type: string }
        images:
          type: array
          items: { type: string }
    ProductVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        price: { type: number }
        cover: { type: string }
        condition: { type: string }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        status: { type: string }
        sellerId: { type: integer, format: int64 }
        sellerNickname: { type: string }
        viewCount: { type: integer }
        favoriteCount: { type: integer }
        createTime: { type: string, format: date-time }
    ProductDetailVO:
      allOf:
        - $ref: '#/components/schemas/ProductVO'
        - type: object
          properties:
            description: { type: string }
            originalPrice: { type: number }
            tradeType: { type: string }
            tradePlace: { type: string }
            images:
              type: array
              items: { type: string }
            seller: { $ref: '#/components/schemas/SellerVO' }
    CategoryVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId: { type: integer, format: int64 }
        sort: { type: integer }

    # ---------- 订单 ----------
    OrderCreateDTO:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, format: int64 }
        remark: { type: string }
        tradePlace: { type: string }
        appointmentTime: { type: string, format: date-time }
    OrderVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string }
        productId: { type: integer, format: int64 }
        productTitle: { type: string }
        productCover: { type: string }
        buyerId: { type: integer, format: int64 }
        buyerNickname: { type: string }
        sellerId: { type: integer, format: int64 }
        sellerNickname: { type: string }
        amount: { type: number }
        status: { type: string }
        tradeType: { type: string }
        tradePlace: { type: string }
        appointmentTime: { type: string, format: date-time }
        createTime: { type: string, format: date-time }
    PayVO:
      type: object
      properties:
        orderNo: { type: string }
        payType: { type: string }
        payUrl: { type: string }

    # ---------- 评价 ----------
    ReviewCreateDTO:
      type: object
      required: [orderId, score]
      properties:
        orderId: { type: integer, format: int64 }
        score: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        images:
          type: array
          items: { type: string }
    ReviewVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        fromUserId: { type: integer, format: int64 }
        fromUserNickname: { type: string }
        toUserId: { type: integer, format: int64 }
        score: { type: integer }
        content: { type: string }
        images:
          type: array
          items: { type: string }
        reply: { type: string }
        createTime: { type: string, format: date-time }

    # ---------- 消息 ----------
    MessageVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        title: { type: string }
        content: { type: string }
        isRead: { type: boolean }
        bizId: { type: integer, format: int64 }
        createTime: { type: string, format: date-time }
    AnnouncementVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        createTime: { type: string, format: date-time }

    # ---------- 私信 ----------
    ConversationCreateDTO:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
    ConversationVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        targetUserId: { type: integer, format: int64 }
        targetNickname: { type: string }
        targetAvatar: { type: string }
        lastMessage: { type: string }
        lastMessageTime: { type: string, format: date-time }
        unreadCount: { type: integer }
    ChatMessageVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        conversationId: { type: integer, format: int64 }
        fromUserId: { type: integer, format: int64 }
        toUserId: { type: integer, format: int64 }
        content: { type: string }
        type: { type: string }
        status: { type: string }
        createTime: { type: string, format: date-time }

    # ---------- 举报 ----------
    ReportCreateDTO:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [product, user, order] }
