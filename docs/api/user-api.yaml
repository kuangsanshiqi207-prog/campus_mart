openapi: 3.0.3
info:
  title: CampusTrade 用户端 API
  version: 1.0.0
  description: 用户端接口，买卖合一

servers:
  - url: http://localhost:8080

tags:
  - name: 01-用户端-认证
  - name: 02-用户端-个人中心
  - name: 03-用户端-市集
  - name: 04-用户端-我的商店
  - name: 05-用户端-交易
  - name: 06-用户端-评价
  - name: 07-用户端-消息
  - name: 08-用户端-私信
  - name: 09-用户端-举报
  - name: 10-用户端-AI客服
  - name: 11-用户端-个人统计
  - name: 12-用户端-文件

security:
  - BearerAuth: []

paths:

  # ==================== 01 认证 ====================
  /user/auth/send-code:
    post:
      tags: [01-用户端-认证]
      summary: 发送验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCodeDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/auth/register:
    post:
      tags: [01-用户端-认证]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }

  /user/auth/login:
    post:
      tags: [01-用户端-认证]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginVO' }

  /user/auth/logout:
    post:
      tags: [01-用户端-认证]
      summary: 用户登出
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/auth/reset-password:
    post:
      tags: [01-用户端-认证]
      summary: 重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/auth/me:
    get:
      tags: [01-用户端-认证]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }

  # ==================== 02 个人中心 ====================
  /user/profile:
    get:
      tags: [02-用户端-个人中心]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }
    put:
      tags: [02-用户端-个人中心]
      summary: 修改个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/profile/password:
    put:
      tags: [02-用户端-个人中心]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordUpdateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/certification:
    post:
      tags: [02-用户端-个人中心]
      summary: 提交校园认证
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }
    get:
      tags: [02-用户端-个人中心]
      summary: 查看认证状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CertificationVO' }

  /user/addresses:
    get:
      tags: [02-用户端-个人中心]
      summary: 地址列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AddressVO' }
    post:
      tags: [02-用户端-个人中心]
      summary: 新增地址
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }

  /user/addresses/{id}:
    put:
      tags: [02-用户端-个人中心]
      summary: 修改地址
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }
    delete:
      tags: [02-用户端-个人中心]
      summary: 删除地址
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 03 市集 ====================
  /user/market/products:
    get:
      tags: [03-用户端-市集]
      summary: 商品列表/搜索
      security: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, price_asc, price_desc, hot] } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }

  /user/market/products/{id}:
    get:
      tags: [03-用户端-市集]
      summary: 商品详情
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductDetailVO' }

  /user/market/products/recommend:
    get:
      tags: [03-用户端-市集]
      summary: 首页推荐
      security: []
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }

  /user/market/products/{id}/similar:
    get:
      tags: [03-用户端-市集]
      summary: 相似商品
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }

  /user/market/products/{id}/seller:
    get:
      tags: [03-用户端-市集]
      summary: 查看卖家主页
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SellerVO' }

  /user/market/categories:
    get:
      tags: [03-用户端-市集]
      summary: 分类列表
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryVO' }

  /user/market/favorites/{productId}:
    post:
      tags: [03-用户端-市集]
      summary: 收藏商品
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }
    delete:
      tags: [03-用户端-市集]
      summary: 取消收藏
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/market/favorites:
    get:
      tags: [03-用户端-市集]
      summary: 我的收藏
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }

  /user/market/history:
    get:
      tags: [03-用户端-市集]
      summary: 浏览历史
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }
    delete:
      tags: [03-用户端-市集]
      summary: 清空浏览历史
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 04 我的商店 ====================
  /user/shop/products:
    post:
      tags: [04-用户端-我的商店]
      summary: 发布商品
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }
    get:
      tags: [04-用户端-我的商店]
      summary: 我的商品列表
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageProductVO' } } } }

  /user/shop/products/{id}:
    get:
      tags: [04-用户端-我的商店]
      summary: 我的商品详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductDetailVO' }
    put:
      tags: [04-用户端-我的商店]
      summary: 修改商品
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }
    delete:
      tags: [04-用户端-我的商店]
      summary: 删除商品
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/shop/products/{id}/offline:
    put:
      tags: [04-用户端-我的商店]
      summary: 下架商品
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/shop/products/{id}/online:
    put:
      tags: [04-用户端-我的商店]
      summary: 重新上架
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/shop/stats:
    get:
      tags: [04-用户端-我的商店]
      summary: 我的商品统计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProductStatsVO' }

  # ==================== 05 交易 ====================
  /user/orders:
    post:
      tags: [05-用户端-交易]
      summary: 申请交易
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }
    get:
      tags: [05-用户端-交易]
      summary: 订单列表
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [buy, sell] } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageOrderVO' } } } }

  /user/orders/{id}:
    get:
      tags: [05-用户端-交易]
      summary: 订单详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderVO' }

  /user/orders/{id}/accept:
    put:
      tags: [05-用户端-交易]
      summary: 卖家接受交易
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/orders/{id}/reject:
    put:
      tags: [05-用户端-交易]
      summary: 卖家拒绝交易
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/orders/{id}/cancel:
    put:
      tags: [05-用户端-交易]
      summary: 取消订单
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/orders/{id}/complete:
    put:
      tags: [05-用户端-交易]
      summary: 买家确认完成
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/orders/{id}/pay:
    post:
      tags: [05-用户端-交易]
      summary: 订单支付
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payType: { type: string, enum: [wechat, alipay, offline] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayVO' }

  /user/orders/{id}/refund:
    post:
      tags: [05-用户端-交易]
      summary: 申请退款
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 06 评价 ====================
  /user/reviews:
    post:
      tags: [06-用户端-评价]
      summary: 发表评价
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }

  /user/reviews/mine:
    get:
      tags: [06-用户端-评价]
      summary: 我发出的评价
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageReviewVO' } } } }

  /user/reviews/received:
    get:
      tags: [06-用户端-评价]
      summary: 我收到的评价
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageReviewVO' } } } }

  /user/reviews/product/{productId}:
    get:
      tags: [06-用户端-评价]
      summary: 商品评价列表
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageReviewVO' } } } }

  /user/reviews/{id}/reply:
    post:
      tags: [06-用户端-评价]
      summary: 回复评价
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 07 消息 ====================
  /user/messages:
    get:
      tags: [07-用户端-消息]
      summary: 消息列表
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: isRead, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageMessageVO' } } } }

  /user/messages/unread-count:
    get:
      tags: [07-用户端-消息]
      summary: 未读消息数
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }

  /user/messages/{id}/read:
    put:
      tags: [07-用户端-消息]
      summary: 标记已读
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/messages/read-all:
    put:
      tags: [07-用户端-消息]
      summary: 全部已读
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/messages/{id}:
    delete:
      tags: [07-用户端-消息]
      summary: 删除消息
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/announcements:
    get:
      tags: [07-用户端-消息]
