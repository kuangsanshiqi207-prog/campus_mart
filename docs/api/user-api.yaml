      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreateDTO' }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultLong' } } } }
    get:
      tags: [09-用户端-举报]
      summary: 我的举报
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageReportVO' } } } }

  /user/reports/{id}:
    get:
      tags: [09-用户端-举报]
      summary: 举报详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReportVO' }

  /user/reports/{id}/appeal:
    post:
      tags: [09-用户端-举报]
      summary: 提交申诉
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                images:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 10 AI客服 ====================
  /user/ai/chat/sessions:
    post:
      tags: [10-用户端-AI客服]
      summary: 创建会话
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatSessionVO' }
    get:
      tags: [10-用户端-AI客服]
      summary: 我的会话列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ChatSessionVO' }

  /user/ai/chat/sessions/{id}/messages:
    get:
      tags: [10-用户端-AI客服]
      summary: 会话消息历史
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ChatMessageVO' }
    post:
      tags: [10-用户端-AI客服]
      summary: 发送消息
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatMessageVO' }

  /user/ai/chat/sessions/{id}/transfer:
    post:
      tags: [10-用户端-AI客服]
      summary: 转人工客服
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  /user/ai/chat/sessions/{id}/rate:
    post:
      tags: [10-用户端-AI客服]
      summary: 满意度评价
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }

  # ==================== 11 个人统计 ====================
  /user/stats/overview:
    get:
      tags: [11-用户端-个人统计]
      summary: 我的数据概览
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserOverviewVO' }

  /user/stats/shop:
    get:
      tags: [11-用户端-个人统计]
      summary: 我的商店统计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProductStatsVO' }

  /user/stats/orders:
    get:
      tags: [11-用户端-个人统计]
      summary: 我的交易统计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserOrderStatsVO' }

  /user/stats/reviews:
    get:
      tags: [11-用户端-个人统计]
      summary: 我的评价统计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserReviewStatsVO' }

  /user/stats/credit:
    get:
      tags: [11-用户端-个人统计]
      summary: 信用分流水
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/PageCreditLogVO' } } } }

  /user/stats/credit/trend:
    get:
      tags: [11-用户端-个人统计]
      summary: 信用分趋势
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TrendVO' }

  /user/stats/orders/trend:
    get:
      tags: [11-用户端-个人统计]
      summary: 交易趋势
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [buy, sell] } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
