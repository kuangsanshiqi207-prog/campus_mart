# ==================== 服务 ====================
server:
  port: ${app.port}

# ==================== Spring ====================
spring:
  application:
    name: ${app.name}
  profiles:
    active: ${app.profile:dev}
  datasource:
    driver-class-name: ${db.driver-class-name}
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      database: ${redis.database}
      timeout: ${redis.timeout}
      lettuce:
        pool:
          max-active: ${redis.lettuce.pool.max-active}
          max-idle: ${redis.lettuce.pool.max-idle}
          min-idle: ${redis.lettuce.pool.min-idle}
# ==================== JWT ====================
campus:
  jwt:
    admin-secret-key: ${jwt.admin-secret-key}
    admin-ttl: ${jwt.admin-ttl}
    admin-token-name: ${jwt.admin-token-name}
    user-secret-key: ${jwt.user-secret-key}
    user-ttl: ${jwt.user-ttl}
    user-token-name: ${jwt.user-token-name}
  sms:
    code-length: ${sms.code-length}
    expire-minutes: ${sms.expire-minutes}

# ==================== MyBatis ====================
mybatis:
  configuration:
    map-underscore-to-camel-case: ${mybatis.map-underscore-to-camel-case}
  mapper-locations: ${mybatis.mapper-locations}
  type-aliases-package: ${mybatis.type-aliases-package}

# ==================== 日志 ====================
logging:
  level:
    com.example: ${logging.level.com.example}

# ==================== 接口文档 ====================
springdoc:
  api-docs:
    path: ${springdoc.api-docs.path}
  swagger-ui:
    path: ${springdoc.swagger-ui.path}

knife4j:
  enable: ${knife4j.enable}
  setting:
    language: ${knife4j.setting.language}