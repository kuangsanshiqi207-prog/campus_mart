server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: 192.168.231.200
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        ip: 127.0.0.1
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ============ 1. user-service（认证 + 个人中心 + 用户管理 + 认证审核）============
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/auth/**,/admin/auth/**,/user/profile/**,/user/certification/**,/user/addresses/**,/admin/users/**,/admin/certifications/**

        # ============ 2. file-service（文件上传）============
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/user/files/**

        # ============ 3. message-service（站内信 + 公告 + 私信 + WebSocket）============
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/user/messages/**,/user/announcements/**,/user/chat/**,/ws/**

        # ============ 4. biz-service（商品 + 订单 + 评价 + 举报 + 统计，兜底）============
        - id: biz-service
          uri: lb://biz-service
          predicates:
            - Path=/**

# JWT 密钥（必须和 user-service、biz-service 一致）
campus:
  jwt:
    user-secret-key: campus-mart-user-secret-key-please-change-in-production-1234567890

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: debug
    org.springframework.cloud.gateway: info