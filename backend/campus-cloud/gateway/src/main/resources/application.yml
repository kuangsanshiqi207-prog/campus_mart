server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: 192.168.231.200
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        ip: 127.0.0.1
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ============ 1. user-service（认证 + 个人中心 + 用户管理 + 认证审核）============
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/auth/**,/admin/auth/**,/user/profile/**,/user/certification/**,/user/addresses/**,/admin/users/**,/admin/certifications/**

        # ============ 2. file-service（文件上传）============
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/user/files/**

        # ============ 3. message-service（站内信 + 公告 + 私信 + WebSocket）============
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/user/messages/**,/user/announcements/**,/admin/announcements/**,/user/chat/**,/ws/**

        # ============ 4. product-service（商品 + 评价 + 类目）============
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/user/market/**,/user/shop/**,/user/reviews/**,/admin/categories/**,/admin/products/**,/admin/reviews/**

        # ============ 5. audit-service（内容审核）============
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/admin/audit/**

        # ============ 6. trade-service（订单）============
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/user/orders/**

        # ============ 7. payment-service（支付）============
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/user/payments/**

        # ============ 8. biz-service（举报 + 统计）============
        - id: biz-service
          uri: lb://biz-service
          predicates:
            - Path=/user/reports/**,/user/stats/**,/admin/reports/**,/admin/appeals/**,/admin/stats/**

        # ============ 9. ai-service（AI 客服，Python FastAPI）============
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/customer-service/**

# JWT 密钥（必须和 user-service、biz-service 一致）
campus:
  jwt:
    user-secret-key: campus-mart-user-secret-key-please-change-in-production-1234567890

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: debug
    org.springframework.cloud.gateway: info