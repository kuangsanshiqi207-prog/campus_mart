server:
  port: 8082    # 沿用 mart-server 的旧端口

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_mart?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: 192.168.231.200
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        ip: 127.0.0.1

# ==================== JWT 配置 ====================
campus:
  jwt:
    admin-secret-key: campus-mart-admin-secret-key-please-change-in-production-1234567890
    admin-ttl: 7200000
    admin-token-name: Authorization
    user-secret-key: campus-mart-user-secret-key-please-change-in-production-1234567890
    user-ttl: 604800000
    user-token-name: Authorization
  sms:
    code-length: 6
    expire-minutes: 5

# ==================== MyBatis ====================
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.entity

# ==================== 日志 ====================
logging:
  level:
    com.example: debug

# ==================== 接口文档 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html