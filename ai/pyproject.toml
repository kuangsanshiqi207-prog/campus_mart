[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-mart-ai"
version = "0.1.0"
description = "校集 AI 服务：AI 审核 + AI 客服（FastAPI + LangChain）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-text-splitters>=0.2",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
